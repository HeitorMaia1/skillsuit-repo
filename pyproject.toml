[project]
name = "skillsuit"
version = "0.1.0"
description = "Wearable motor-capture to AI-training-ready data pipeline, with a Port-Hamiltonian Neural Network modeling core."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Heitor Menin Maia" }]
keywords = ["imu", "sensor-fusion", "hamiltonian-neural-network", "motor-data", "wearable"]

# Phase 1.2 dependency set. Pinned floors, not exact versions; `uv sync` writes uv.lock.
# Synthetic motion is generated by integrating the analytic rigid-body dynamics with scipy
# (exact ground-truth energy/dissipation — the right tool for a 2-DOF arm + pendulum). PyBullet
# is an optional `sim` extra only: it ships no cp312/macOS-arm64 wheel and its source build fails
# on the current Apple toolchain, and a contact engine would add solver artifacts we don't want.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.13",
  "torch>=2.3",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "jupyter>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "jsonschema>=4.0",
]
# Optional contact-physics engine; not needed for the analytic 2-DOF/pendulum pipeline.
sim = [
  "pybullet>=3.2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: packages live at the repo root (skilldata/, and later fusion/, models/, capture/).
# Tools run from the repo root, so imports resolve via the working directory — no src/ or PYTHONPATH.
# Only skilldata exists at the Phase 1 stage; the others get added here as they land.
[tool.hatch.build.targets.wheel]
packages = ["skilldata"]

[tool.uv]
# uv manages the project venv; `uv sync` installs the locked dependency set.
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["skilldata", "tests", "firmware/tests"]
# Flat layout: put the repo root on sys.path so `sim` and `skilldata` source packages import
# from the working dir during tests (pytest otherwise only adds the test file's own directory).
pythonpath = ["."]
